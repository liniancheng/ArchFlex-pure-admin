server:
  port: 2005

spring:
  application:
    name: api-gateway-dynamic
  cloud:
    # 1. 统一配置中心
    config:
      discovery:
        enabled: true
        service-id: base-cloud-config-server
      profile: dev
      name: config

    # 2. 网关核心配置
    gateway:
      # 关闭注册中心自动路由（对应原 zuul.ignoredServices: '*'）
      # 3. 全局跨域 / 过滤器 / 路由规则建议放到
      #    application.yml 或远程配置中心，这里不再赘述
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true


  # 4. 文件上传大小保持 100 MB
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:6868/oauth2/jwks

# 5. Swagger 聚合所需的服务列表（业务代码里自己消费）
swagger:
  client:
    - base-cloud-user-service
    - base-cloud-gen-service
    - dgmp-metadata-service
    - dgmp-common-service
    - dgmp-quality-service
    - dgmp-standard-service

# 6. 白名单 URL（原 ignore.urls）
#    在 Gateway 中一般通过
#    spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
#    或自定义 GlobalFilter 实现，这里仅做保留，代码里读取即可
ignore:
  urls:
    - /admin/user/forgot/**
    - /admin/user/changeLoginPwd/**
    - /admin/public/index
    - /**.css               # 原来是/**/*.css
    - /auth/**
    - /admin/user/mobile/**
    - /admin/user/captcha
    - /refresh/**
    - /swagger-ui.html
    - /swagger-resources/**
    - /v2/api-docs        # 直接写固定路径
    - /webjars/**

logging:
  level:
    com.littlelee.base.gateway.router: DEBUG